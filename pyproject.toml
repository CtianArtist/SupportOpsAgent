[project]
name = "supportops-agent"
version = "0.1.0"
description = "A testable customer-support AI agent with explicit tool permissions and approval gates."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
